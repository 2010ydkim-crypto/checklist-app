<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 체크리스트</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1f2328; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-soft: #dbeafe; --danger: #dc2626; --done: #9ca3af;
    --warn-bg: #fef3c7; --warn-text: #92400e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111418; --card: #1b1f24; --text: #e6e8eb; --muted: #9aa3ad;
      --line: #2d333b; --accent: #60a5fa; --accent-soft: #1e3a5f; --danger: #f87171; --done: #6b7280;
      --warn-bg: #3b2f12; --warn-text: #fcd34d;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }
  .topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .user { font-size: .8rem; color: var(--muted); text-align: right; word-break: break-all; }
  .user button { margin-top: 4px; font-size: .8rem; padding: 4px 10px; }

  .notice { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 12px 14px; font-size: .9rem; margin-bottom: 16px; }
  .notice code { font-size: .85em; }
  .notice button { margin-top: 8px; font-size: .85rem; }

  /* 로그인 */
  .auth label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; }
  .auth input { width: 100%; }
  .auth .row { display: flex; gap: 8px; margin-top: 18px; }
  .auth .row button { flex: 1; }
  .msg { font-size: .85rem; margin-top: 12px; min-height: 1.3em; }
  .msg.err { color: var(--danger); }

  /* 날짜 선택 */
  .datebar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .datebar input[type=date] {
    padding: 7px 10px; font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); color-scheme: light dark;
  }
  .datebar .nav { padding: 7px 11px; }
  .datebar .spacer { flex: 1; }
  .dayname { font-weight: 600; font-size: 1.05rem; margin: 4px 0 14px; }
  .dayname small { color: var(--muted); font-weight: 400; margin-left: 6px; }

  .views { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .views button { border: none; border-radius: 0; padding: 7px 12px; font-size: .85rem; }
  .views button.on { background: var(--accent); color: #fff; }

  .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .stat { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin: 6px 0 20px; }

  form.add { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text], input[type=email], input[type=password] {
    flex: 1; min-width: 0; padding: 10px 12px; font-size: 1rem; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); padding: 8px 12px;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 10px 16px; }

  .filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters button { font-size: .85rem; padding: 4px 12px; border-radius: 99px; }
  .filters button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px;
    border-bottom: 1px solid var(--line);
  }
  li.group {
    margin-top: 14px; padding: 6px 4px; border-bottom: 2px solid var(--line);
    font-weight: 600; font-size: .95rem; justify-content: space-between; cursor: pointer;
  }
  li.group:first-child { margin-top: 0; }
  li.group .gcount { color: var(--muted); font-weight: 400; font-size: .85rem; }
  li.group.today { color: var(--accent); }
  li input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; cursor: pointer; }
  li .label { flex: 1; word-break: break-word; cursor: text; }
  li.done .label { text-decoration: line-through; color: var(--done); }
  li .del { border: none; background: none; color: var(--muted); font-size: 1.1rem; padding: 2px 8px; opacity: .5; }
  li:hover .del, li .del:focus { opacity: 1; color: var(--danger); }
  li input.edit { flex: 1; }
  .empty { justify-content: center; color: var(--muted); padding: 28px 0; border-bottom: none; }

  .footer { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; flex-wrap: wrap; }
  .footer button { font-size: .85rem; }
  .sync { font-size: .75rem; color: var(--muted); text-align: right; margin-top: 10px; min-height: 1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="topline">
      <div>
        <h1>✅ 나의 체크리스트</h1>
        <p class="sub">날짜별 할 일을 클라우드(Supabase)에 저장합니다.</p>
      </div>
      <div class="user" id="userBox" hidden>
        <div id="userEmail"></div>
        <button id="logoutBtn">로그아웃</button>
      </div>
    </div>

    <!-- 설정 안내 -->
    <div class="notice" id="setupNotice" hidden>
      <b>Supabase 연결 정보가 아직 없습니다.</b><br>
      <code>config.js</code> 파일에 Supabase 프로젝트의 URL과 anon 키를 입력하세요.
      자세한 방법은 <code>배포안내.md</code>를 참고하세요.
    </div>

    <!-- 로그인 화면 -->
    <form class="auth" id="authView" hidden>
      <label for="email">이메일</label>
      <input type="email" id="email" autocomplete="email" required>
      <label for="password">비밀번호 (6자 이상)</label>
      <input type="password" id="password" autocomplete="current-password" minlength="6" required>
      <div class="row">
        <button class="primary" type="submit" id="loginBtn">로그인</button>
        <button type="button" id="signupBtn">회원가입</button>
      </div>
      <div class="msg" id="authMsg"></div>
    </form>

    <!-- 체크리스트 화면 -->
    <div id="appView" hidden>
      <div class="notice" id="importNotice" hidden>
        <span id="importText"></span><br>
        <button id="importBtn">클라우드로 가져오기</button>
        <button id="importSkip">무시</button>
      </div>

      <div class="datebar">
        <button class="nav" id="prevDay" aria-label="이전 날">◀</button>
        <input type="date" id="datePick">
        <button class="nav" id="nextDay" aria-label="다음 날">▶</button>
        <button id="todayBtn">오늘</button>
        <span class="spacer"></span>
        <div class="views" id="views">
          <button data-v="day" class="on">하루</button>
          <button data-v="all">날짜별 전체</button>
        </div>
      </div>
      <div class="dayname" id="dayName"></div>

      <div class="progress"><div id="bar"></div></div>
      <div class="stat"><span id="count">0 / 0 완료</span><span id="pct">0%</span></div>

      <form class="add" id="addForm">
        <input type="text" id="newItem" placeholder="할 일을 입력하세요" autocomplete="off" maxlength="200">
        <button class="primary" type="submit">추가</button>
      </form>

      <div class="filters" id="filters">
        <button data-f="all" class="on">전체</button>
        <button data-f="todo">진행 중</button>
        <button data-f="done">완료</button>
      </div>

      <ul id="list"></ul>

      <div class="footer">
        <button id="clearDone">완료 항목 삭제</button>
        <span>
          <button id="exportBtn">텍스트로 복사</button>
          <button id="resetBtn">전체 초기화</button>
        </span>
      </div>
      <div class="sync" id="sync"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const TABLE = 'checklist_items';
const LOCAL_KEY = 'checklist-items-v1';   // 예전(브라우저 저장) 버전의 데이터
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const $ = id => document.getElementById(id);

const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayStr = () => ymd(new Date());
function pretty(s) {
  const d = parse(s);
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})`;
}
function relative(s) {
  const diff = Math.round((parse(s) - parse(todayStr())) / 86400000);
  return { 0: '오늘', '-1': '어제', 1: '내일' }[diff] || '';
}

let items = [];
let filter = 'all';
let view = 'day';
let selDate = todayStr();
let user = null;

/* ---------- Supabase 연결 ---------- */
const configured = window.SUPABASE_URL && window.SUPABASE_ANON_KEY
  && !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON');
const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function setSync(text) { $('sync').textContent = text; }
function fail(err, what) {
  console.error(err);
  alert(`${what} 중 오류가 발생했습니다.\n${err.message || err}`);
  loadItems();   // 서버 상태로 다시 맞춤
}

async function loadItems() {
  setSync('불러오는 중…');
  const { data, error } = await db.from(TABLE).select('*')
    .order('date', { ascending: true }).order('created_at', { ascending: true });
  if (error) { setSync('불러오기 실패'); alert('항목을 불러오지 못했습니다.\n' + error.message); return; }
  items = data;
  setSync('저장됨 ✓');
  render();
}

async function addItem(text) {
  const temp = { id: 'tmp-' + Math.random(), text, done: false, date: selDate };
  items.push(temp); render(); setSync('저장 중…');
  const { data, error } = await db.from(TABLE).insert({ text, date: selDate }).select().single();
  if (error) return fail(error, '추가');
  Object.assign(temp, data); setSync('저장됨 ✓'); render();
}

async function updateItem(item, patch) {
  Object.assign(item, patch); render(); setSync('저장 중…');
  const { error } = await db.from(TABLE).update(patch).eq('id', item.id);
  if (error) return fail(error, '수정');
  setSync('저장됨 ✓');
}

async function deleteItems(list) {
  if (!list.length) return;
  const ids = list.map(i => i.id);
  items = items.filter(i => !ids.includes(i.id)); render(); setSync('저장 중…');
  const { error } = await db.from(TABLE).delete().in('id', ids);
  if (error) return fail(error, '삭제');
  setSync('저장됨 ✓');
}

/* ---------- 예전 브라우저 저장 데이터 가져오기 ---------- */
function localItems() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch { return []; }
}
function checkImport() {
  const old = localItems();
  $('importNotice').hidden = !old.length;
  if (old.length) $('importText').textContent = `이 브라우저에 예전에 저장한 항목 ${old.length}개가 있습니다.`;
}
$('importBtn').addEventListener('click', async () => {
  const rows = localItems().map(i => ({
    text: String(i.text).slice(0, 200),
    done: !!i.done,
    date: i.date || (i.created ? ymd(new Date(i.created)) : todayStr()),
  }));
  $('importBtn').disabled = true;
  const { error } = await db.from(TABLE).insert(rows);
  $('importBtn').disabled = false;
  if (error) return alert('가져오기 실패: ' + error.message);
  try { localStorage.removeItem(LOCAL_KEY); } catch {}
  $('importNotice').hidden = true;
  loadItems();
});
$('importSkip').addEventListener('click', () => { $('importNotice').hidden = true; });

/* ---------- 로그인 ---------- */
function showAuthMsg(text, isErr) {
  $('authMsg').textContent = text;
  $('authMsg').className = 'msg' + (isErr ? ' err' : '');
}
const KO_ERR = {
  'Invalid login credentials': '이메일 또는 비밀번호가 올바르지 않습니다.',
  'Email not confirmed': '이메일 인증이 아직 안 됐습니다. 메일함의 인증 링크를 눌러주세요.',
  'User already registered': '이미 가입된 이메일입니다. 로그인해 주세요.',
};
const koErr = e => KO_ERR[e.message] || e.message;

$('authView').addEventListener('submit', async e => {
  e.preventDefault();
  showAuthMsg('로그인 중…');
  const { error } = await db.auth.signInWithPassword({ email: $('email').value, password: $('password').value });
  if (error) showAuthMsg(koErr(error), true);
});
$('signupBtn').addEventListener('click', async () => {
  if (!$('authView').reportValidity()) return;
  showAuthMsg('가입 중…');
  const { data, error } = await db.auth.signUp({
    email: $('email').value, password: $('password').value,
    options: { emailRedirectTo: location.origin + location.pathname },
  });
  if (error) return showAuthMsg(koErr(error), true);
  if (!data.session) showAuthMsg('가입 완료! 메일함에서 인증 링크를 누른 뒤 로그인하세요.');
});
$('logoutBtn').addEventListener('click', () => db.auth.signOut());

function applySession(session) {
  const newUser = session?.user || null;
  if (newUser?.id === user?.id) return;
  user = newUser;
  $('authView').hidden = !!user;
  $('appView').hidden = !user;
  $('userBox').hidden = !user;
  if (user) {
    $('userEmail').textContent = user.email;
    showAuthMsg('');
    checkImport();
    loadItems();
  } else {
    items = [];
    render();
  }
}

/* ---------- 화면 그리기 ---------- */
function visibleItems() { return items.filter(i => view === 'all' || i.date === selDate); }
function passFilter(i) { return filter === 'all' || (filter === 'done' ? i.done : !i.done); }

function itemRow(item) {
  const li = document.createElement('li');
  if (item.done) li.classList.add('done');

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = item.done;
  cb.addEventListener('change', () => updateItem(item, { done: cb.checked }));

  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = item.text;
  label.title = '더블클릭하여 수정';
  label.addEventListener('dblclick', () => startEdit(li, label, item));

  const del = document.createElement('button');
  del.className = 'del';
  del.textContent = '✕';
  del.setAttribute('aria-label', '삭제');
  del.addEventListener('click', () => deleteItems([item]));

  li.append(cb, label, del);
  return li;
}

function render() {
  $('datePick').value = selDate;
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === view));

  const dn = $('dayName');
  dn.innerHTML = '';
  dn.append(view === 'all' ? '날짜별 전체 보기' : pretty(selDate));
  const small = document.createElement('small');
  small.textContent = view === 'all' ? `새 항목은 ${pretty(selDate)}에 추가됩니다` : relative(selDate);
  if (small.textContent) dn.append(small);

  const list = $('list');
  list.innerHTML = '';
  const scope = visibleItems();
  const shown = scope.filter(passFilter);

  if (!shown.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = scope.length ? '해당하는 항목이 없습니다.'
      : view === 'day' ? '이 날짜에는 항목이 없습니다. 위에서 추가해 보세요!'
      : '아직 항목이 없습니다.';
    list.appendChild(li);
  } else if (view === 'day') {
    shown.forEach(i => list.appendChild(itemRow(i)));
  } else {
    const groups = {};
    shown.forEach(i => (groups[i.date] ||= []).push(i));
    Object.keys(groups).sort().reverse().forEach(date => {
      const all = items.filter(i => i.date === date);
      const g = document.createElement('li');
      g.className = 'group' + (date === todayStr() ? ' today' : '');
      g.title = '클릭하면 이 날짜만 봅니다';
      const name = document.createElement('span');
      const rel = relative(date);
      name.textContent = pretty(date) + (rel ? ` · ${rel}` : '');
      const cnt = document.createElement('span');
      cnt.className = 'gcount';
      cnt.textContent = `${all.filter(i => i.done).length} / ${all.length}`;
      g.append(name, cnt);
      g.addEventListener('click', () => { selDate = date; view = 'day'; render(); });
      list.appendChild(g);
      groups[date].forEach(i => list.appendChild(itemRow(i)));
    });
  }

  const total = scope.length, done = scope.filter(i => i.done).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  $('bar').style.width = pct + '%';
  $('count').textContent = `${done} / ${total} 완료`;
  $('pct').textContent = pct + '%';
}

function startEdit(li, label, item) {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'edit';
  input.maxLength = 200;
  input.value = item.text;
  li.replaceChild(input, label);
  input.focus();
  input.select();
  let finished = false;
  const finish = commit => {
    if (finished) return;
    finished = true;
    const v = input.value.trim();
    if (!commit || v === item.text) return render();
    if (v) updateItem(item, { text: v }); else deleteItems([item]);
  };
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') finish(true);
    if (e.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
}

/* ---------- 버튼 이벤트 ---------- */
function shiftDay(n) {
  const d = parse(selDate);
  d.setDate(d.getDate() + n);
  selDate = ymd(d); view = 'day'; render();
}
$('prevDay').addEventListener('click', () => shiftDay(-1));
$('nextDay').addEventListener('click', () => shiftDay(1));
$('todayBtn').addEventListener('click', () => { selDate = todayStr(); view = 'day'; render(); });
$('datePick').addEventListener('change', e => { if (e.target.value) { selDate = e.target.value; view = 'day'; render(); } });

$('views').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  view = b.dataset.v; render();
});

$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('newItem').value.trim();
  if (!v) return;
  $('newItem').value = '';
  addItem(v);
});

$('filters').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('on', x === b));
  render();
});

$('clearDone').addEventListener('click', () => deleteItems(visibleItems().filter(i => i.done)));

$('resetBtn').addEventListener('click', () => {
  if (items.length && confirm('모든 날짜의 항목을 클라우드에서 삭제할까요? 되돌릴 수 없습니다.')) deleteItems([...items]);
});

$('exportBtn').addEventListener('click', async () => {
  const scope = visibleItems();
  const dates = [...new Set(scope.map(i => i.date))].sort();
  const text = dates.map(d =>
    `■ ${pretty(d)}\n` + scope.filter(i => i.date === d).map(i => `${i.done ? '[x]' : '[ ]'} ${i.text}`).join('\n')
  ).join('\n\n');
  try {
    await navigator.clipboard.writeText(text);
    $('exportBtn').textContent = '복사됨!';
    setTimeout(() => $('exportBtn').textContent = '텍스트로 복사', 1500);
  } catch { alert(text || '항목이 없습니다.'); }
});

/* ---------- 시작 ---------- */
if (!configured) {
  $('setupNotice').hidden = false;
} else {
  db.auth.getSession().then(({ data }) => {
    applySession(data.session);
    if (!data.session) $('authView').hidden = false;
  });
  db.auth.onAuthStateChange((_event, session) => applySession(session));
}
</script>
</body>
</html>
